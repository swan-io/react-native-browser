buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet("kotlinVersion", "1.9.22")}")
        classpath("com.android.tools.build:gradle:8.2.1")
    }
    configurations.classpath.resolutionStrategy {
        // Netty 4.1.72.Final is pulled transitively by the Android Gradle plugin (via grpc-netty)
        // and is affected by CVE-2023-44487, CVE-2025-55163, CVE-2026-33870, CVE-2026-55833,
        // CVE-2026-56819 and CVE-2026-75595. Netty modules are not compatible across versions,
        // so every module on the classpath is forced to the same release. Explicit `force`
        // entries (rather than an `eachDependency` rule) are what dependency scanners can read.
        def nettyVersion = "4.1.137.Final"
        force "io.netty:netty-buffer:${nettyVersion}",
              "io.netty:netty-codec:${nettyVersion}",
              "io.netty:netty-codec-http:${nettyVersion}",
              "io.netty:netty-codec-http2:${nettyVersion}",
              "io.netty:netty-codec-socks:${nettyVersion}",
              "io.netty:netty-common:${nettyVersion}",
              "io.netty:netty-handler:${nettyVersion}",
              "io.netty:netty-handler-proxy:${nettyVersion}",
              "io.netty:netty-resolver:${nettyVersion}",
              "io.netty:netty-transport:${nettyVersion}",
              "io.netty:netty-transport-native-unix-common:${nettyVersion}"
    }
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

android {
    namespace "io.swan.rnbrowser"

    buildToolsVersion safeExtGet("buildToolsVersion", "34.0.0")
    compileSdkVersion safeExtGet("compileSdkVersion", 34)

    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())
        minSdkVersion safeExtGet("minSdkVersion", 23)
        targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
    lintOptions {
        abortOnError false
    }
    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ["src/newarch"]
            } else {
                java.srcDirs += ["src/oldarch"]
            }
        }
    }
}

repositories {
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url("$rootDir/../node_modules/react-native/android")
    }
    mavenCentral()
    google()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-native:+" // From node_modules
    implementation "androidx.browser:browser:${safeExtGet("androidXBrowserVersion", "1.8.0")}"
}
