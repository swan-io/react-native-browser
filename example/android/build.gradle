buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
    configurations.classpath.resolutionStrategy {
        // Netty 4.1.110.Final is pulled transitively by the Android Gradle plugin (via grpc-netty)
        // and is affected by CVE-2025-55163, CVE-2026-33870, CVE-2026-55833, CVE-2026-56819 and
        // CVE-2026-75595. Netty modules are not compatible across versions, so every module on
        // the classpath is forced to the same release.
        def nettyVersion = "4.1.137.Final"
        force "io.netty:netty-buffer:${nettyVersion}",
              "io.netty:netty-codec:${nettyVersion}",
              "io.netty:netty-codec-http:${nettyVersion}",
              "io.netty:netty-codec-http2:${nettyVersion}",
              "io.netty:netty-codec-socks:${nettyVersion}",
              "io.netty:netty-common:${nettyVersion}",
              "io.netty:netty-handler:${nettyVersion}",
              "io.netty:netty-handler-proxy:${nettyVersion}",
              "io.netty:netty-resolver:${nettyVersion}",
              "io.netty:netty-transport:${nettyVersion}",
              "io.netty:netty-transport-native-unix-common:${nettyVersion}"
    }
}

apply plugin: "com.facebook.react.rootproject"
